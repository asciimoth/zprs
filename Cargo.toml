[package]
name = "zprs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Zig progress protocol client library for Rust"
license = "CC0-1.0"
repository = "https://github.com/asciimoth/zprs"
documentation = "https://docs.rs/zprs"
readme = "README.md"
keywords = ["zig", "progress", "cli", "subprocess", "protocol"]
categories = ["command-line-interface"]
include = ["/src/**", "/examples/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "processes"
path = "tests/processes.rs"
harness = false
